*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f5f3;color:#2b2a28}
.faixa{display:flex;height:8px}.faixa span{flex:1}
header{background:#fff;padding:28px 16px;text-align:center;border-bottom:1px solid #e4e2dd}
.logos{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}
.logos img.wap{height:48px}.logos img.waaw{height:44px}.logos img.tl{height:52px}.sep{width:1px;height:48px;background:#d9d6cf}

main{max-width:880px;margin:0 auto;padding:32px 16px 48px}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:#6b6862;margin:28px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
a.card{display:block;background:#fff;border:1px solid #e4e2dd;border-left:6px solid var(--c);border-radius:10px;padding:20px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
a.card strong{display:block;font-size:1.1rem;margin-bottom:6px}a.card span{color:#6b6862;font-size:.92rem}
@media(max-width:480px){.logos .sep{display:none}}
footer{text-align:center;color:#8a867f;font-size:.8rem;padding:0 16px 32px}
