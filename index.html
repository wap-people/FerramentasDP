<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Processos · Administração de Pessoal · WAP</title>
<style>
:root{
  --verde:#8DC04F; --amarelo:#F7B22A; --rosa:#D9375D; --ciano:#2FA8B5;
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#1E2226; --muted:#5D6871; --line:#DCE1E5; --soft:#F4F6F7; --focus:#14909C;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#16191C; --surface:#1F2327; --ink:#E8ECEF; --muted:#9DA8B1; --line:#353C43; --soft:#262B30; --focus:#6FCAD4; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#16191C; --surface:#1F2327; --ink:#E8ECEF; --muted:#9DA8B1; --line:#353C43; --soft:#262B30; --focus:#6FCAD4; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Roboto",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15.5px;line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:inherit}

.listra{height:3px;background:linear-gradient(90deg,var(--verde) 0 25%,var(--amarelo) 25% 50%,var(--rosa) 50% 75%,var(--ciano) 75% 100%)}
.topo{position:relative;background:#fff;color:#1E2226;border-bottom:1px solid #DCE1E5;overflow:hidden}
.topo-in{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;min-height:76px}
.topo .wap{height:42px;width:auto;display:block}
.topo .waaw{height:26px;width:auto;display:block}
.topo .tl{height:30px;width:auto;display:block}
.topo .sep{width:1px;align-self:stretch;margin:4px 0;background:#D4D9DE}
.ctx{display:flex;flex-direction:column;margin-left:22px;min-width:0}
.ctx small{font-size:.84rem;color:#5D6871}
.ctx strong{font-size:1.3rem;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.topo .barras{position:absolute;right:0;top:-2px;height:80px;width:auto;pointer-events:none}


/* ---------- Layout: lateral de temas + área principal ---------- */
.layout{flex:1;width:100%;max-width:1180px;margin:0 auto;display:flex;align-items:flex-start;gap:28px;padding:28px 22px 40px}
mark{background:color-mix(in srgb,var(--amarelo) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}

.busca{position:relative}
.busca svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.busca input{width:100%;font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px 9px 34px}
.busca input::placeholder{color:var(--muted)}
.busca input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 20%,transparent)}

.lateral{position:sticky;top:16px;flex:none;width:270px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px}
.lateral .busca{margin:0 4px 12px}
.rotulo{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:4px 10px 6px}
.tema-btn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;padding:9px 10px;border-radius:8px;font-weight:600;font-size:.9rem;line-height:1.3}
.tema-btn .ponto{flex:none;width:10px;height:10px;border-radius:3px;background:var(--cor)}
.tema-btn .nome{flex:1;min-width:0}
.tema-btn .seta{flex:none;width:15px;height:15px;color:var(--muted);transition:transform .18s}
.tema-btn .selo{flex:none;font-size:.66rem;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:0 7px}
.tema:hover>.tema-btn,.tema.ativo>.tema-btn{background:var(--soft)}
.tema.ativo>.tema-btn{box-shadow:inset 3px 0 0 var(--cor)}
.assuntos{display:none;margin:2px 0 8px 15px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--cor) 45%,var(--line))}
.tema.aberto>.assuntos{display:block}
.tema.aberto>.tema-btn .seta{transform:rotate(90deg)}
/* passar o cursor abre os assuntos */
@media (hover:hover){
  .tema:hover>.assuntos{display:block}
  .tema:hover>.tema-btn .seta{transform:rotate(90deg)}
}
.assuntos a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-size:.86rem}
.assuntos a:hover{background:var(--soft);color:var(--ink)}
.assuntos .n{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--cor);color:var(--cor);font-size:.7rem;font-weight:700}
.assuntos .construcao{display:block;padding:6px 10px;color:var(--muted);font-size:.84rem;font-style:italic}
.vazio-lat{color:var(--muted);font-size:.86rem;padding:8px 10px;margin:0}

main{flex:1;min-width:0}
.cab{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.cab .busca{flex:1;max-width:520px;margin:0 auto}
.busca.grande input{padding:11px 14px 11px 38px;font-size:.95rem;border-radius:10px}
.busca.grande svg{left:13px}
.menu{display:none;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:.88rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}
.menu svg{width:18px;height:18px}
.filtro{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:.88rem;margin:-8px 0 18px}
.filtro b{color:var(--ink)}
.filtro button{font:inherit;font-size:.82rem;font-weight:600;color:var(--focus);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}

.tema-sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 20px 8px;margin-bottom:18px;scroll-margin-top:16px;position:relative;overflow:hidden}
.tema-sec::before{content:"";position:absolute;left:0;top:22px;height:5px;width:44px;border-radius:0 99px 99px 0;background:var(--cor)}
.tema-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tag{display:block;font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tema-h h2{margin:2px 0 0;font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.abrir{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:8px;background:var(--cor);color:#fff;font-weight:600;font-size:.85rem;text-decoration:none;transition:filter .15s,gap .15s}
.abrir:hover{filter:brightness(1.07);gap:10px}
.abrir svg{width:14px;height:14px}
.abrir.off{background:var(--soft);color:var(--muted);border:1px dashed var(--line);cursor:default}
.abrir.off:hover{filter:none;gap:7px}

.tema-h p{margin:2px 0 0;color:var(--muted);font-size:.86rem}
.grade{margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ferr{display:flex;flex-direction:column;gap:4px;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;transition:border-color .15s,box-shadow .15s}
.ferr .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--cor);color:var(--cor);font-weight:700;font-size:.82rem;margin-bottom:4px}
.ferr.off .num{border-style:dashed;border-color:var(--line);color:var(--muted)}
.ferr b{font-weight:600;font-size:.94rem;line-height:1.3}
.ferr small{color:var(--muted);font-size:.82rem;line-height:1.4;flex:1}
.ferr .ir{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:.8rem;font-weight:600;color:var(--cor)}
.ferr .ir .seta{width:14px;height:14px;transition:transform .15s}
a.ferr:hover{border-color:color-mix(in srgb,var(--cor) 55%,var(--line));box-shadow:0 8px 22px rgba(20,30,40,.08)}
a.ferr:hover .seta{transform:translateX(3px)}
.ferr.off{border-style:dashed;background:var(--soft)}
.ferr.off .ir{color:var(--muted)}
.vazio{text-align:center;color:var(--muted);padding:40px 0}

footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 28px}
.veu{display:none}

@media (max-width:900px){ .topo .barras{opacity:.35} }
@media (max-width:820px){
  .layout{padding:20px 16px 32px}
  .lateral{position:fixed;inset:0 auto 0 0;z-index:30;width:min(86vw,300px);max-height:none;border-radius:0 12px 12px 0;transform:translateX(-105%);transition:transform .22s ease;padding-top:max(14px,env(safe-area-inset-top,0px))}
  .layout.gaveta .lateral{transform:none}
  .layout.gaveta .veu{display:block;position:fixed;inset:0;z-index:25;background:rgba(10,14,18,.45)}
  .menu{display:inline-flex}
}
@media (max-width:640px){
  .topo-in{gap:12px;padding:10px 16px;min-height:62px}
  .topo .wap{height:32px} .topo .waaw{height:20px} .topo .tl{height:24px}
  .topo .barras{display:none}
  .topo .waaw,.topo .tl,.topo .sep{display:none} .ctx{margin-left:6px} .ctx strong{font-size:1.08rem}
  .tema-sec{padding:18px 14px 6px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

<script>
/* =====================================================================
   TEMAS → ASSUNTOS
   Para criar um tema novo, copie um bloco abaixo e ajuste.
   Tema com "assuntos:[]" aparece como "Em andamento".
   ===================================================================== */
const TEMAS = [
  { id:"admissional", nome:"Processo Admissional", tag:"Admissão", cor:"#7FB043", pagina:"admissional.html",
    desc:"Da conferência dos documentos à montagem do kit de cada admitido.",
    assuntos:[
      { nome:"Validação dos documentos admissionais", desc:"Confere os documentos de cada admitido pelo cargo e separa tudo para arquivo.", link:"admissional.html#documentos" },
      { nome:"Kit admissional", desc:"Contrato, ficha de registro e Manual de Conduta em um único PDF por pessoa.", link:"admissional.html#kit" }
    ]},
  { id:"demissional", nome:"Processo Demissional", tag:"Desligamento", cor:"#D9375D", pagina:"demissional.html",
    desc:"Do comunicado ao colaborador até o aviso de envio dos documentos.",
    assuntos:[
      { nome:"Carta de desligamento", desc:"Comunicado conforme o tipo de rescisão e o aviso prévio, pronto em PDF.", link:"demissional.html#carta" },
      { nome:"Kit de homologação", desc:"TRCT e documentos conferidos pelo motivo, em um PDF por colaborador.", link:"demissional.html#kit" },
      { nome:"Aviso por WhatsApp", desc:"Mensagem pronta avisando que os documentos foram para o e-mail pessoal.", link:"demissional.html#whatsapp" }
    ]},
  { id:"folha", nome:"Processo de Folha de Pagamento", tag:"Folha", cor:"#F7B22A",
    desc:"Ferramentas para a conferência e o fechamento da folha mensal.",
    assuntos:[] },
  { id:"ponto", nome:"Processo de Ponto", tag:"Ponto", cor:"#2FA8B5",
    desc:"Ferramentas para o controle e o tratamento do ponto dos colaboradores.",
    assuntos:[] }
];

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc  = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const marca = (t,q) => { if(!q) return esc(t); const i=norm(t).indexOf(norm(q)); if(i<0) return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length)); };
const seta = '<svg class="seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const temLink = t => t.assuntos.length>0;

let temaAtivo = null;          // null = todos
const fixos = new Set();       // temas abertos por clique

/* ---------- Lateral ---------- */
function desenharLateral(){
  const q = document.getElementById("buscaTema").value.trim(), nq = norm(q);
  let h = "";
  TEMAS.forEach(t=>{
    const temaBate = !nq || norm(t.nome).includes(nq);
    const assuntos = t.assuntos.filter(a => temaBate || norm(a.nome).includes(nq) || norm(a.desc).includes(nq));
    if(!temaBate && !assuntos.length) return;
    const aberto = fixos.has(t.id) || (nq && !temaBate);
    h += `<div class="tema${aberto?" aberto":""}${temaAtivo===t.id?" ativo":""}${temLink(t)?"":" breve"}" data-id="${t.id}" style="--cor:${t.cor}">
      <button class="tema-btn" aria-expanded="${aberto}"><span class="ponto"></span><span class="nome">${marca(t.nome,q)}</span>${temLink(t)?"":'<span class="selo">Em andamento</span>'}${seta}</button>
      <div class="assuntos">
        ${assuntos.length?assuntos.map((a,i)=>`<a href="${a.link}"><span class="n">${i+1}</span>${marca(a.nome,q)}</a>`).join(""):'<span class="construcao">Etapas em construção</span>'}
      </div></div>`;
  });
  document.getElementById("listaTemas").innerHTML = h || '<p class="vazio-lat">Nenhum tema ou assunto encontrado.</p>';
}

document.getElementById("listaTemas").addEventListener("click", e=>{
  const a = e.target.closest("a"), b = e.target.closest(".tema-btn");
  if(a) return;
  if(b){ const id = b.parentElement.dataset.id;
    if(fixos.has(id) && temaAtivo===id){ fixos.delete(id); } else { fixos.add(id); }
    escolherTema(id); }
});
document.getElementById("buscaTema").addEventListener("input", desenharLateral);

/* ---------- Conteúdo ---------- */
function desenharConteudo(){
  const q = document.getElementById("buscaFerramenta").value.trim(), nq = norm(q);
  const lista = TEMAS.filter(t => !temaAtivo || t.id===temaAtivo);
  let h = "";
  if(temaAtivo){
    const t = TEMAS.find(x=>x.id===temaAtivo);
    h += `<div class="filtro">Mostrando <b>${esc(t.nome)}</b> <button id="limpar">Ver todos os temas</button></div>`;
  }
  lista.forEach(t=>{
    const temaBate = nq && norm(t.nome+" "+t.desc).includes(nq);
    const assuntos = t.assuntos.filter(a => !nq || temaBate || norm(a.nome+" "+a.desc).includes(nq));
    if(nq && !temaBate && !assuntos.length) return;
    h += `<section class="tema-sec" id="sec-${t.id}" style="--cor:${t.cor}">
      <header class="tema-h">
        <div><span class="tag">${esc(t.tag)}</span><h2>${marca(t.nome,q)}</h2><p>${marca(t.desc,q)}</p></div>
        ${t.pagina?`<a class="abrir" href="${t.pagina}">Abrir processo <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>`:'<span class="abrir off">Em andamento</span>'}
      </header>
      <div class="grade">${assuntos.length ? assuntos.map((a,i)=>`<a class="ferr" href="${a.link}"><span class="num">${i+1}</span><b>${marca(a.nome,q)}</b><small>${marca(a.desc,q)}</small><span class="ir">Acessar ${seta}</span></a>`).join("")
        : `<div class="ferr off"><span class="num">…</span><b>Etapas em construção</b><small>Logo fica disponível aqui.</small></div>`}</div>
    </section>`;
  });
  if(!lista.length || !h.includes("tema-sec")) h += `<p class="vazio">Nenhuma ferramenta encontrada${q?` para “${esc(q)}”`:""}.</p>`;
  document.getElementById("conteudo").innerHTML = h;
  document.getElementById("limpar")?.addEventListener("click", ()=>escolherTema(null));
}
document.getElementById("buscaFerramenta").addEventListener("input", desenharConteudo);

function escolherTema(id){
  temaAtivo = id;
  if(id) fixos.add(id);
  desenharLateral(); desenharConteudo();
  if(id) history.replaceState(null,"", "#"+id); else history.replaceState(null,"",location.pathname);
}

/* ---------- Gaveta (celular) ---------- */
const layout = document.getElementById("layout");
document.getElementById("btnMenu").onclick = ()=>layout.classList.add("gaveta");
document.getElementById("veu").onclick = fecharGaveta;
function fecharGaveta(){ layout.classList.remove("gaveta"); }

/* ---------- Início (aceita links como index.html#demissional) ---------- */
const hTema = location.hash.slice(1);
if(TEMAS.some(t=>t.id===hTema)){ escolherTema(hTema); }
else { desenharLateral(); desenharConteudo(); }
</script>
</body></html>
